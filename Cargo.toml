[package]
name = "whoamifuck"
version = "8.0.0"
edition = "2021"
description = "司稽 (Whoamifuck / Chief-Inspector) - Linux 应急响应与入侵检测工具 (Rust 重构版)"
authors = ["Enomothem", "Eonian Sharp"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/enomothem/Whoamifuck"

[[bin]]
name = "who"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.clippy]
too_many_arguments = "allow"
