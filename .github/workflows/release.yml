name: Release

# 推送形如 v8.0.0 的标签时触发：交叉编译多平台二进制并发布到 GitHub Release。
# 也支持手动触发（workflow_dispatch）用于验证构建。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          dist="whoamifuck-${version}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/who" "$dist/"
          cp README.md README-EN.md who.sh LICENSE "$dist/" 2>/dev/null || true
          tar czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # 即使某个目标构建失败，也发布已成功的产物；仅在标签推送时创建 Release。
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Whoamifuck ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## 司稽 Whoamifuck ${{ github.ref_name }} · Rust 重构版

            本版本为 `who.sh` 的 Rust 重构版本，忠实保留原有 CLI 接口、输出风格与检测逻辑，
            产出单一静态二进制 `who`，便于在应急现场分发。

            ### 下载
            - `whoamifuck-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz` — x86_64 (glibc)
            - `whoamifuck-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz` — x86_64 (静态 musl，最通用)
            - `whoamifuck-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz` — ARM64 (静态 musl)

            每个压缩包附带 `.sha256` 校验文件。解压后 `sudo ./who -h` 查看帮助。
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
